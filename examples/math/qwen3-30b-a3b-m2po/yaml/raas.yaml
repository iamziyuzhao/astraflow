# ============================================================================
# RaaS config — Inference serving instance (hardware/resources)
# Experiment: math / qwen3-30b-a3b-m2po
#
# Hardware: any 4-GPU rollout node with >=80 GB per GPU
# (Qwen3-30B-A3B is ~61 GB bf16 per replica)
#   model0:  DP=4, TP=1
#
# For the remote 4xB200 rollout node use raas_b200.yaml instead
# (same layout, B200-specific notes).
#
# Merged with experiment.yaml at launch (--config experiment.yaml --config raas.yaml)
# experiment.yaml provides: model_path, tokenizer_path, seed, dtype, models/gconfig
# ============================================================================

rollout:
  # Halved vs the dense recipes: with R3 every finished sequence carries
  # ~1.5 KB/token of routed-expert payload (48 layers x top-8 int32), so
  # keep per-tick pull sizes bounded.
  max_concurrent_rollouts: 256
  # Cap concurrent eval prefills to bound peak KV pressure during eval
  # bursts — default 128 OOMs sglang on the 16k dense recipes already.
  max_concurrent_evals: 64
  pause_grace_period: 3
  # Adaptive availability — drive /availability off sglang /get_load.
  enable_adaptive_availability: true
  target_waiting_queue_per_dp: 4
  adaptive_step_size: 4
  load_cache_ttl_ms: 100

engine:
  model0:
    backend: sglang
    data_parallel_size: 4

sglang:
  # ctx-4096 bring-up. Raise together with gconfig.max_new_tokens and
  # dataset max_length once weight sync + R3 are validated.
  context_length: 4096
  mem_fraction_static: 0.7
  # REQUIRED with enable_return_routed_experts: the routed-experts
  # capturer sizes its device buffer as
  # max(chunked_prefill_size, max_running_requests) rows per DP rank.
  # AstraFlow's default chunked_prefill_size=-1 (unchunked) undersizes it
  # and any prefill batch larger than max_running_requests tokens crashes
  # mid-forward. 32768 = max_prefill_tokens, so nothing actually chunks
  # at context_length<=32768 while the buffer covers the largest possible
  # prefill batch (~50 MB device memory).
  chunked_prefill_size: 32768
  max_running_requests: null
  skip_tokenizer_init: true
  # R3: allocate the server-side routed-experts capturer so requests with
  # return_routed_experts get per-token expert indices back.
  # NOTE: keep speculative decoding, hierarchical cache, and PD
  # disaggregation OFF with R3 (they bypass or corrupt capture); none of
  # them is exposed in SGLangConfig and all default off in sglang.
  # disable_radix_cache also stays at its AstraFlow default (true).
  enable_return_routed_experts: true
