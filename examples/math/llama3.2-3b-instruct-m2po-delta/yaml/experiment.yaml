# ============================================================================
# Experiment config — AstraFlow service + Trainer
# Experiment: math / llama3.2-3b-instruct-m2po-delta
#
# Llama-3.2-3B-Instruct math RL with M2PO, ctx 16k, lr 5e-6, delta TCP weight transfer.
#
# NOTE: Llama-3.2-3B supports a 128k context (max_position_embeddings 131072,
#   rope_theta 500000, rope_scaling type "llama3" with original window 8192).
#   This recipe uses context_length 16384, max_new_tokens 14000. 16384 is past the
#   8192 original window, so rope_scaling ("llama3") is what keeps positions valid;
#   it applies as shipped and nothing extra is needed here. We use the -Instruct
#   checkpoint because the RLVR workflow applies a chat template and the base
#   Llama-3.2-3B ships none.
#
# GPU layout (default, 8 GPUs):
#   SERVICE_CUDA_VISIBLE_DEVICES=0,1,2,3 -> RaaS (model0 dp=4)
#   TRAINER_MODEL0_GPUS=4,5,6,7          -> Trainer model0 (FSDP, 4 GPUs)
# ============================================================================

# ── Experiment: identity, model, shared settings ──
experiment:
  experiment_name: astraflow-math
  trial_name: llama3.2-3b-instruct-m2po-delta
  fileroot: ./data-experiments/${experiment.experiment_name}/${experiment.trial_name}

  model_path: "meta-llama/Llama-3.2-3B-Instruct"
  tokenizer_path: "meta-llama/Llama-3.2-3B-Instruct"
  seed: 1
  dtype: bfloat16
  weight_transfer_mode: tcp
  weight_transfer_strategies: delta

# ── RaaS: what to generate (inference-level config) ──
# model keys here also determine expected_model_ids for AstraFlow service
raas:
  models:
    model0:
      backend: sglang
      gconfig:
        n_samples: 8
        temperature: 1.0
        max_new_tokens: 14000
        min_new_tokens: 0
  # Delta transfer: send only changed weights each step, with a full
  # resync every N steps to bound drift.
  delta_full_sync_interval: 10

# ── AstraFlow: data pipeline ──
# auto-derives: expected_model_ids from raas.models keys
# auto-derives: dump_dir from experiment.fileroot
dataflow:
  host: "0.0.0.0"
  port: 8000

  buffer:
    size: 10000
    replay_size: 10000
    replay_ratio: 0
    max_staleness: 8
    filter_function: filter_zero_adv

  rollout_dataset:
    dataset_fn: "astraflow.dataflow.dataset.deepscaler:get_deepscaler_rl_dataset"
    max_length: 2000

  workflow_spec:
    workflow_cls: "rlvr"
    reward_fn: "math_verify"
    # Llama-3's chat template has no thinking mode; the flag is silently
    # ignored (apply_chat_template rejects the kwarg and is retried without it).
    enable_thinking: false

  eval_workflows:
    math_eval:
      workflow_cls: "rlvr"
      reward_fn: "math_verify"
      enable_thinking: false
      gconfig_overrides:
        temperature: 0.6
        n_samples: 1

  eval_datasets:
    aime24:
      dataset_fn: "astraflow.dataflow.dataset.aime24x4:get_aime_2024x4_test_dataset"
      max_length: 2000
      repeat: 4
      eval_workflow: math_eval
    aime25:
      dataset_fn: "astraflow.dataflow.dataset.aime25x4:get_aime_2025x4_test_dataset"
      max_length: 2000
      repeat: 4
      eval_workflow: math_eval
    amc:
      dataset_fn: "astraflow.dataflow.dataset.amc24:get_amc_2024x4_test_dataset"
      max_length: 2000
      repeat: 4
      eval_workflow: math_eval
    minerva:
      dataset_fn: "astraflow.dataflow.dataset.minervamath:get_minerva_math_test_dataset"
      max_length: 2000
      repeat: 4
      eval_workflow: math_eval
    math500:
      dataset_fn: "astraflow.dataflow.dataset.math500:get_math500_test_dataset"
      max_length: 2000
      repeat: 4
      eval_workflow: math_eval

# ── Trainer base: shared config ──
# auto-derives from experiment: experiment_name, trial_name, fileroot,
#   tokenizer_path, seed, dtype, weight_transfer_mode
# auto-derives from raas.models.<model_id>: actor.path, actor.max_new_tokens,
#   ref.path
# auto-derives: saver, recover, stats_logger fields from experiment section
# auto-derives: cluster.name_resolve from experiment.fileroot
# auto-derives: trial_name suffix from model_id (e.g. trial_name-model0)
trainer_base:
  total_train_steps: 800
  train_batch_size: 256
  n_samples: 8
  engine:
    backend: fsdp
    data_parallel_size: 4

  actor:
    attn_impl: kernels-community/flash-attn2
    gradient_checkpointing: true
    mb_spec:
      # Longest packed sequence is prompt(<=2000) + gen(<=14000) = 16000 tokens,
      # which fits in one 20240-token microbatch.
      max_tokens_per_mb: 20240
    optimizer:
      type: adam
      lr: 5e-6
      weight_decay: 0.01
      beta1: 0.9
      beta2: 0.999
      eps: 1e-8
      lr_scheduler_type: constant
      gradient_clipping: 1.0
    # PPO / M2PO algorithm
    m2_threshold: 0.01
    eps_clip: 100.0
    eps_clip_higher: 100.0
    reward_scaling: 1
    reward_bias: 0
    kl_ctl: 0.00
    kl_penalty_coef: 0.001
    ppo_n_minibatches: 4
    reward_norm: { mean_level: group, std_level: group }
    adv_norm: { mean_level: batch, std_level: batch }

  ref:
    attn_impl: kernels-community/flash-attn2
    mb_spec:
      max_tokens_per_mb: 20240

  recover:
    mode: auto
    freq_steps: 25

  evaluator:
    eval_at_start: false
    freq_steps: 25

  stats_logger:
    wandb:
      mode: online
      project: astraflow-math-llama
      id_suffix: "uid"

# ── Trainer for model0 — only overrides ──
trainer_model0:
  model_id: model0
  stats_logger:
    wandb:
      tags: ["m2po", "math", "astraflow-v2", "llama3.2-3b", "instruct", "tcp", "ctx8k", "delta"]
